schema_version: 1

context:
  name: nomad-parser-plugins-electronic
  version: "1.0.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_parser_plugins_electronic-${{ version }}.tar.gz
  sha256: f9229ad8e1cf34ae853d6ef912909bc1f3137b7ca1980eea8284244defd17eaa

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - h5py >=3.6.0
    - lxml >=5.2
    - nomad-lab >=1.3.17
    - nomad-schema-plugin-simulation-workflow >=1.0.1
    - nomad-schema-plugin-run >=1.0.1
    - nomad-parser-plugins-simulation >=1.0.2
    - netcdf4 <=1.7.2
    - pyyaml >=6.0
    - pydantic >=1.10.8
    - numpy

tests:
  - python:
      imports:
        - electronicparsers
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Collection of NOMAD parsers for electronic structure codes.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/nomad-coe/electronic-parsers

extra:
  recipe-maintainers:
    - jan-janssen
